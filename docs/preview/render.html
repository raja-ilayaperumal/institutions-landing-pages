<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clema Institution Landing — Dynamic Renderer</title>
<style>
  :root {
    --bg: #f7f9fc;
    --card: #ffffff;
    --border: #e2e8f0;
    --ink: #1a202c;
    --ink-2: #4a5568;
    --ink-3: #718096;
    --ink-4: #a0aec0;
    --accent: #1a365d;
    --accent-2: #2c5282;
    --accent-soft: #ebf4ff;
    --good: #2f855a;
    --good-soft: #c6f6d5;
    --warn: #b7791f;
    --warn-soft: #fefcbf;
    --bad: #c53030;
    --bad-soft: #fed7d7;
    --radius: 6px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
    --shadow-md: 0 2px 8px rgba(15, 23, 42, .08);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
                 system-ui, sans-serif;
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    line-height: 1.55;
  }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .page { max-width: 1180px; margin: 0 auto; padding: 24px; }
  .grid-2col { display: grid; grid-template-columns: 200px 1fr; gap: 28px; }
  @media (max-width: 860px) {
    .grid-2col { grid-template-columns: 1fr; }
    .toc { position: static !important; max-height: none !important; }
  }
  .toc {
    position: sticky; top: 24px; align-self: start;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; font-size: 13px;
    box-shadow: var(--shadow-sm); max-height: calc(100vh - 48px);
    overflow-y: auto;
  }
  .toc h3 { margin: 0 0 8px; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.7px; }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc li { margin: 4px 0; }
  .toc a { color: var(--ink-2); display: block; padding: 4px 6px; border-radius: 4px; }
  .toc a:hover { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
  .toc a.dim { color: var(--ink-4); }
  .hero {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: white; border-radius: 8px; padding: 32px;
    box-shadow: var(--shadow-md); margin-bottom: 18px;
  }
  .hero h1 { margin: 0 0 6px; font-size: 28px; font-weight: 700; line-height: 1.25; }
  .hero .sub { color: rgba(255,255,255,.85); font-size: 14px; margin-bottom: 14px; }
  .hero .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .hero .tag { background: rgba(255,255,255,.18); color: white; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
  .hero-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
  .hero-stat .lbl { font-size: 11px; color: rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .hero-stat .val { font-size: 22px; font-weight: 600; }
  .hero-stat .sub2 { font-size: 11px; color: rgba(255,255,255,.7); margin-top: 1px; }
  section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
    box-shadow: var(--shadow-sm); scroll-margin-top: 16px;
  }
  section h2 {
    color: var(--accent); margin: 0 0 16px; font-size: 18px; font-weight: 600;
    padding-bottom: 8px; border-bottom: 2px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  section h2 .count { color: var(--ink-4); font-weight: 400; font-size: 13px; }
  section p { margin: 0 0 10px; color: var(--ink-2); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .stat { background: var(--bg); padding: 12px 14px; border-radius: 4px; border-left: 3px solid var(--accent); }
  .stat .label { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat .value { font-size: 19px; font-weight: 600; color: var(--ink); }
  .stat .sub { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
  .stat.accent-good { border-left-color: var(--good); }
  .stat.accent-warn { border-left-color: var(--warn); }
  table { width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 14px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--bg); font-weight: 600; color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar-row { display: grid; grid-template-columns: 220px 1fr 70px; gap: 14px; align-items: center; margin: 6px 0; font-size: 13px; }
  .bar-row .lbl { color: var(--ink-2); }
  .bar-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
  .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 5px; }
  .bar.muted > span { background: linear-gradient(90deg, var(--ink-4), var(--ink-3)); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.2px; }
  .pill-good { background: var(--good-soft); color: var(--good); }
  .pill-warn { background: var(--warn-soft); color: var(--warn); }
  .pill-bad  { background: var(--bad-soft); color: var(--bad); }
  .pill-neutral { background: var(--accent-soft); color: var(--accent); }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .team-card { background: var(--bg); border-left: 3px solid var(--accent-2); padding: 14px; border-radius: 4px; }
  .team-card .name { font-weight: 600; font-size: 15px; color: var(--ink); }
  .team-card .title { font-size: 13px; color: var(--ink-2); margin: 3px 0; }
  .team-card .contact { font-size: 12px; color: var(--ink-3); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .team-card .contact a { color: var(--accent-2); }
  .team-card .li-link { display: inline-flex; align-items: center; gap: 2px; background: #0077b5; color: white; padding: 2px 7px; border-radius: 3px; font-weight: 600; font-size: 11px; }
  .team-card .li-link:hover { text-decoration: none; opacity: .9; }
  .office-card { background: var(--accent-soft); border-left: 4px solid var(--accent); padding: 14px 18px; border-radius: 4px; margin-bottom: 12px; }
  .office-card .name { font-size: 15px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .office-card .division { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
  .office-card .contact-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px; font-size: 13px; margin-top: 8px; }
  .office-card .contact-row .k { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; }
  .office-card .contact-row .v { color: var(--ink); font-weight: 500; }
  .links-list { list-style: none; padding: 0; margin: 0; }
  .links-list li { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
  .links-list li:last-child { border-bottom: none; }
  .links-list .year { font-weight: 700; color: var(--accent); min-width: 60px; }
  .race-bars { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  footer { text-align: center; padding: 18px 0; color: var(--ink-4); font-size: 12px; border-top: 1px solid var(--border); margin-top: 24px; }
  .meta-bar { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 14px; font-size: 12px; color: var(--ink-3); margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
  .center-card { max-width: 540px; margin: 100px auto; padding: 30px; background: var(--card); border-radius: 8px; box-shadow: var(--shadow-md); border: 1px solid var(--border); text-align: center; }
  .center-card h2 { color: var(--accent); margin-top: 0; }
  .center-card code { background: var(--bg); padding: 2px 6px; border-radius: 3px; font-size: 13px; }
</style>
</head>
<body>
<div id="app" class="page"></div>
<script src="render.js"></script>
</body>
</html>
